name: utkarsh_ai
description: Privacy-first AI behavioral wellness companion for students
publish_to: none
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Local database
  sqflite: ^2.3.2
  path: ^1.9.0
  uuid: ^4.3.3

  # Secure storage (Android Keystore / iOS Keychain)
  flutter_secure_storage: any

  # Encryption (pure Dart — no native compilation)
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Lottie animations (avatar)
  lottie: ^3.1.0

  # On-device LLM
  llama_cpp_dart: ^0.2.2


  # HTTP client (Groq API)
  http: ^1.2.1

  # Network connectivity
  connectivity_plus: ^6.0.3

  # Notifications
  flutter_local_notifications: ^17.2.1

  # Charts
  fl_chart: ^0.68.0

  # Supabase (optional cloud sync)
  supabase_flutter: ^2.12.2

  # Text to speech
  flutter_tts: ^4.0.2

  # Speech to text
  speech_to_text: any

  # Cryptography for PBKDF2 (Zero-Knowledge)
  cryptography: ^2.7.0

  # PIN input UI
  pinput: ^4.0.0

  # Shared preferences (for non-sensitive settings)
  shared_preferences: ^2.2.3

  # Intl (date formatting)
  intl: ^0.19.0

  # Path provider
  path_provider: ^2.1.3

  # Environment variables (.env)
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.3.2
  permission_handler: ^11.3.1
  cryptography_flutter: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0b0c11" # Dark color to match the logo background
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/lottie/
    - assets/models/
    - assets/logo.png
